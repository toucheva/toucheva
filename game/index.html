<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ไร่ดีมีสุข — ต้นแบบ Phase 0</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%A5%AC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">ไร่ดีมีสุข <span>Phase 0</span></div>
      <div class="stats">
        <div class="stat"><span class="k">วัน</span><b id="stat-day">1</b></div>
        <div class="stat"><span class="k">เงิน</span><b id="stat-money">0</b></div>
        <div class="stat stamina">
          <span class="k">พลังงาน</span>
          <div class="bar"><i id="stamina-fill"></i></div>
          <b id="stat-stamina">0</b>
        </div>
        <div class="stat combo" id="combo" hidden><span class="k">คอมโบ</span><b id="combo-val">×0</b></div>
      </div>
      <div class="topactions">
        <button id="btn-mute" class="ghost" title="เปิด/ปิดเสียง">🔊</button>
        <button id="btn-reset" class="ghost" title="เริ่มใหม่">เริ่มใหม่</button>
        <button id="btn-sleep" class="primary">เข้านอน</button>
      </div>
    </header>

    <main class="layout">
      <section class="stage">
        <canvas id="board" width="508" height="508" aria-label="แปลงปลูก 8 คูณ 8"></canvas>
        <div class="tools" id="tools" role="toolbar" aria-label="เครื่องมือ"></div>
        <p class="hint" id="hint">เลือกเครื่องมือแล้วคลิกที่แปลง · ลากค้างเพื่อทำงานต่อเนื่อง · กด 1–5 เพื่อสลับเครื่องมือ</p>
      </section>

      <aside class="side">
        <div class="panel" id="panel-plot">
          <h2>แปลงที่เลือก</h2>
          <div id="plot-info" class="plotinfo">ชี้ที่แปลงเพื่อดูรายละเอียด</div>
        </div>

        <div class="panel">
          <h2>เมล็ดพันธุ์</h2>
          <div id="seedlist" class="seedlist"></div>
        </div>

        <div class="panel">
          <h2>ผลผลิตในคลัง</h2>
          <div id="storage" class="storage">ยังไม่มีผลผลิต</div>
          <button id="btn-sell" class="primary wide" disabled>ขายทั้งหมด</button>
        </div>
      </aside>
    </main>
  </div>

  <div class="overlay" id="overlay" hidden>
    <div class="modal" id="modal"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
